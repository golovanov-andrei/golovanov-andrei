name: Profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_activity.py
      - tests/test_activity.py
      - .github/workflows/activity.yml
  pull_request:
    paths:
      - README.md
      - scripts/update_activity.py
      - tests/test_activity.py
      - .github/workflows/activity.yml

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Verify live calendar and SVG generation
        run: python scripts/update_activity.py --output "${{ runner.temp }}/activity.svg"

  update:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate graph from public GitHub data
        run: python scripts/update_activity.py
      - name: Commit refreshed graph
        run: |
          if git diff --quiet -- assets/activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          git commit -m 'chore: refresh profile activity graph'
          git push origin HEAD:main
